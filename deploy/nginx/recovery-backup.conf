# Include with backup-server.conf to reuse private error responses.
location = /api/v1/arkade-recovery-records/fetch {
    access_log off;
    error_log stderr crit;
    if ($http_content_length = "") { return 400; }
    if ($http_transfer_encoding != "") { return 400; }
    client_max_body_size 4k;
    client_body_timeout 15s;
    send_timeout 15s;
    keepalive_timeout 15s;
    keepalive_requests 100;
    client_body_temp_path /var/lib/nginx/backup-client-body;
    limit_req zone=recovery_req_ip burst=64 nodelay;
    limit_req zone=recovery_fetch_all burst=64 nodelay;
    limit_conn recovery_conn_ip 24;
    limit_conn recovery_fetch_conn_all 24;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level info;
    limit_conn_log_level info;
    error_page 400 = @backup_invalid_request;
    error_page 413 = @backup_blob_too_large;
    error_page 429 = @backup_rate_limited;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_request_buffering on;
    proxy_buffering on;
    proxy_max_temp_file_size 4m;
    proxy_temp_path /var/lib/nginx/backup-proxy;
    proxy_intercept_errors off;
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_pass http://127.0.0.1:3000;
}

location = /api/v1/arkade-recovery-records {
    access_log off;
    error_log stderr crit;
    if ($http_content_length = "") { return 400; }
