location = /api/v1/wallet-backups/fetch {
    access_log off;
    error_log stderr crit;
    client_max_body_size 8k;
    client_body_timeout 15s;
    send_timeout 15s;
    keepalive_timeout 15s;
    keepalive_requests 100;
    client_body_temp_path /var/lib/nginx/backup-client-body;
    limit_req zone=backup_req_ip burst=20 nodelay;
    limit_req zone=backup_fetch_all burst=20 nodelay;
    limit_conn backup_conn_ip 8;
    limit_conn backup_conn_all 128;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level info;
    limit_conn_log_level info;
    error_page 413 = @backup_blob_too_large;
    error_page 429 = @backup_rate_limited;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_request_buffering on;
    proxy_buffering on;
    proxy_max_temp_file_size 4m;
    proxy_temp_path /var/lib/nginx/backup-proxy;
    proxy_intercept_errors off;
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_pass http://127.0.0.1:3000;
}

location = /api/v1/wallet-backups {
    access_log off;
    error_log stderr crit;
    client_max_body_size 1536k;
    client_body_timeout 15s;
    send_timeout 15s;
    keepalive_timeout 15s;
    keepalive_requests 100;
    client_body_temp_path /var/lib/nginx/backup-client-body;
    limit_req zone=backup_req_ip burst=20 nodelay;
    limit_req zone=backup_mutation_all burst=15 nodelay;
    limit_conn backup_conn_ip 8;
    limit_conn backup_conn_all 128;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level info;
    limit_conn_log_level info;
    error_page 413 = @backup_blob_too_large;
    error_page 429 = @backup_rate_limited;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_request_buffering on;
    proxy_buffering on;
    proxy_max_temp_file_size 4m;
    proxy_temp_path /var/lib/nginx/backup-proxy;
    proxy_intercept_errors off;
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_pass http://127.0.0.1:3000;
}

location @backup_rate_limited {
    internal;
    access_log off;
    error_log stderr crit;
    default_type application/json;
    add_header Cache-Control "private, no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Retry-After "60" always;
    return 429 '{"code":"RateLimited","reason":"Wallet backup request rate limit exceeded. Retry later.","status":"ERROR"}';
}

location @backup_blob_too_large {
    internal;
    access_log off;
    error_log stderr crit;
    default_type application/json;
    add_header Cache-Control "private, no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
    return 413 '{"code":"BackupBlobTooLarge","reason":"Wallet backup exceeds the maximum object size.","status":"ERROR"}';
}
